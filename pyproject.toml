[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "orbit-desktop"
version = "0.1.0"
description = "ORBIT: Safety-First Desktop AI Assistant Runtime"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "ORBIT Team" }
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "websockets>=12.0",
    "pydantic>=2.6.0",
    "pillow>=10.0.0",
    "numpy>=1.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.pyright]
include = ["src", "tests", "prototypes"]
extraPaths = [
    "src",
    "prototypes/prototype_a_workspace",
    "prototypes/prototype_b_human_takeover",
    "prototypes/prototype_c_keyboard",
    "prototypes/prototype_d_observation",
    "prototypes/prototype_e_pointer",
]

