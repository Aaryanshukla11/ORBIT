<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ORBIT Observation Test Target (Tier 4 Browser)</title>
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 20px;
        }
        .container {
            max-width: 800px;
            margin: auto;
            background: #1e293b;
            padding: 24px;
            border-radius: 8px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.5);
        }
        h1 { color: #38bdf8; font-size: 20px; }
        .control-group { margin-bottom: 16px; }
        label { display: block; margin-bottom: 6px; font-weight: bold; color: #94a3b8; }
        input[type="text"], select {
            width: 100%;
            padding: 8px 12px;
            background: #0f172a;
            border: 1px solid #334155;
            color: #f8fafc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        .btn {
            background: #0284c7;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            margin-right: 8px;
        }
        .btn-danger { background: #e11d48; }
        .btn-success { background: #16a34a; }
        .status-box {
            margin-top: 16px;
            padding: 12px;
            background: #020617;
            border: 1px solid #1e293b;
            border-radius: 4px;
            font-family: monospace;
            color: #4ade80;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>ORBIT Prototype D — Tier 4 Browser DOM Observation Harness</h1>
        <p>Ground-truth HTML controls for testing MSAA/UIA accessibility and visual fusion.</p>
        
        <div class="control-group">
            <label for="username_input">Username Input Field</label>
            <input type="text" id="username_input" name="username" value="orbit_agent_2026" />
        </div>

        <div class="control-group">
            <label for="tier_select">Validation Tier Selection</label>
            <select id="tier_select">
                <option value="tier1">Tier 1: Controlled Widget</option>
                <option value="tier2">Tier 2: Native Windows Editor</option>
                <option value="tier3">Tier 3: Complex Native App</option>
                <option value="tier4" selected>Tier 4: Web Browser DOM</option>
            </select>
        </div>

        <div class="control-group">
            <button id="btn_submit" class="btn btn-success" onclick="updateStatus('Action: Submit Clicked')">Submit Form</button>
            <button id="btn_cancel" class="btn btn-danger" onclick="updateStatus('Action: Cancel Clicked')">Cancel Operation</button>
            <button id="btn_refresh" class="btn" onclick="updateStatus('Action: State Refreshed')">Refresh State</button>
        </div>

        <div class="status-box" id="status_display">
            Status: READY_FOR_OBSERVATION (Generation #0)
        </div>
    </div>

    <script>
        function updateStatus(msg) {
            document.getElementById('status_display').innerText = msg + ' @ ' + new Date().toISOString();
        }
    </script>
</body>
</html>
